<div style="min-height: 100vh; background: #F3F4F7; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; color: #17181C; font-size: 15px; line-height: 1.5">

  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 32px; background: #FFFFFF; border-bottom: 1px solid #E4E6EB">

  <div style="display: flex; flex-wrap: wrap; gap: 24px; max-width: 1360px; margin: 0 auto; padding: 24px 32px 32px; box-sizing: border-box">

    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch">

      <section aria-label="대화" style="flex: 999 1 460px; min-width: 0; min-height: 780px; background: #FFFFFF; border: 1px solid #E4E6EB; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #E4E6EB">
          <div role="tablist" aria-label="대화방" style="display: flex; padding: 4px; border-radius: 12px; background: #F3F4F7">
            <button type="button" role="tab" aria-selected="true" style="height: 36px; padding: 0 16px; border: 0; border-radius: 9px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #17181C; box-shadow: 0 1px 2px rgba(23, 24, 28, 0.12); cursor: pointer">대화</button>
            <button type="button" role="tab" aria-selected="false" style="height: 36px; padding: 0 16px; border: 0; border-radius: 9px; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: #4A4E57; cursor: pointer">나레이션</button>
          </div>
          <button type="button" aria-label="대화 검색" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #4A4E57; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          </button>
        </div>

        <div role="log" aria-label="메시지" style="flex: 1; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; justify-content: flex-end">
          <div style="align-self: center; font-size: 12px; color: #626770; font-weight: 500">오늘</div>

          <div style="align-self: flex-start; display: flex; gap: 10px; max-width: 78%">
            <img src="/_blob/e484ac5ceb46043b71c01ae0b9d3decc" alt="" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex: none">
            <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
              <span style="font-size: 12px; color: #626770; font-weight: 500">시로가 먼저 물어봤어 · 오후 12:02</span>
              <div style="padding: 10px 14px; border-radius: 4px 18px 18px 18px; background: #F3F4F7">주인님, 시험 끝나면 제일 먼저 하고 싶은 게 뭐야?</div>
            </div>
          </div>

          <div style="align-self: flex-end; max-width: 70%; padding: 10px 14px; border-radius: 18px 18px 4px 18px; background: #17181C; color: #FFFFFF">일단 잠부터 잘래</div>

          <div style="align-self: flex-start; display: flex; gap: 10px; max-width: 78%">
            <span style="width: 36px; flex: none"></span>
            <div style="padding: 10px 14px; border-radius: 4px 18px 18px 18px; background: #F3F4F7">그럴 줄 알았어. 그럼 저녁 약속 전에 깨워 줄까?</div>
          </div>

          <div style="align-self: flex-end; max-width: 70%; padding: 10px 14px; border-radius: 18px 18px 4px 18px; background: #17181C; color: #FFFFFF">응 6시에 깨워줘</div>

          <div style="align-self: flex-start; display: flex; gap: 10px; max-width: 78%">
            <span style="width: 36px; flex: none"></span>
            <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
              <div style="padding: 10px 14px; border-radius: 4px 18px 18px 18px; background: #F3F4F7">6시에 꼭 깨울게. 시험 잘 보고 와!</div>
              <div style="padding: 12px 14px; border-radius: 14px; background: #E6F3FA; display: flex; align-items: center; gap: 12px">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#165E89" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8.5 12l2.5 2.5 4.5-5"></path></svg>
                <span style="display: flex; flex-direction: column; flex: 1; min-width: 0"><span style="font-size: 12px; color: #165E89; font-weight: 600">할 일에 추가함</span><span style="font-weight: 600">일어나기 · 오늘 18:00</span></span>
                <button type="button" style="height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: #FFFFFF; color: #165E89; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">되돌리기</button>
              </div>
            </div>
          </div>
        </div>

        <form style="display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid #E4E6EB">
          <button type="button" aria-label="사진이나 파일 첨부" style="width: 48px; height: 48px; border: 0; border-radius: 14px; background: transparent; color: #4A4E57; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.5 8.5a5 5 0 0 1-7-7L14 4.5a3.3 3.3 0 0 1 4.7 4.7L10.2 17.7a1.7 1.7 0 0 1-2.4-2.4L15.5 7.6"></path></svg>
          </button>
          <label for="pc-msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">메시지</label>
          <input id="pc-msg" type="text" placeholder="시로에게 말하기…" style="flex: 1; min-width: 0; height: 48px; padding: 0 16px; border: 1px solid #D5D8DE; border-radius: 14px; font: inherit; color: #17181C; background: #FFFFFF">
