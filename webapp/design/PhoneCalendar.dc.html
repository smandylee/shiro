<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시로 홈 · 캘린더 (휴대폰)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1F7FB8}a:hover{color:#165E89}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F4F7; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; color: #17181C; font-size: 15px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column">
    <section aria-labelledby="pc-month" style="background: #FFFFFF; border-bottom: 1px solid #E4E6EB; padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="display: flex; align-items: center">
          <button type="button" aria-label="이전 달" style="width: 44px; height: 44px; border: 0; background: transparent; color: #4A4E57; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
          <h1 id="pc-month" style="margin: 0; font-size: 18px; font-weight: 700">2026년 11월</h1>
          <button type="button" aria-label="다음 달" style="width: 44px; height: 44px; border: 0; background: transparent; color: #4A4E57; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
        </div>
        <button type="button" style="height: 36px; padding: 0 12px; border: 1px solid #D5D8DE; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #17181C">오늘</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 12px; font-weight: 600; color: #626770">
        <span style="color: #B23B3B">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="35">
          <div style="height: 46px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 2px">
            <sc-if value="{{d.today}}" hint-placeholder-val="{{false}}">
              <span style="width: 30px; height: 30px; border-radius: 50%; background: #17181C; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums">{{d.num}}</span>
            </sc-if>
            <sc-if value="{{d.plain}}" hint-placeholder-val="{{true}}">
              <span style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-variant-numeric: tabular-nums">{{d.num}}</span>
            </sc-if>
            <sc-if value="{{d.muted}}" hint-placeholder-val="{{false}}">
              <span style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: 500; color: #8A8F98; font-variant-numeric: tabular-nums">{{d.num}}</span>
            </sc-if>
            <span style="display: flex; gap: 3px; height: 6px">
              <sc-for list="{{d.dots}}" as="dot" hint-placeholder-count="0">
                <sc-if value="{{dot.canvas}}" hint-placeholder-val="{{false}}"><span style="width: 6px; height: 6px; border-radius: 50%; background: #C98A2A"></span></sc-if>
                <sc-if value="{{dot.normal}}" hint-placeholder-val="{{true}}"><span style="width: 6px; height: 6px; border-radius: 50%; background: #1F7FB8"></span></sc-if>
              </sc-for>
            </span>
          </div>
        </sc-for>
      </div>
    </section>

    <section aria-labelledby="pc-day" style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <h2 id="pc-day" style="margin: 0; font-size: 16px; font-weight: 700">11월 27일 금요일 <span style="font-size: 13px; font-weight: 500; color: #626770">· 오늘</span></h2>
      <div style="display: flex; gap: 12px; padding: 12px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E6EB">
        <span style="width: 4px; border-radius: 2px; background: #1F7FB8"></span>
        <span style="display: flex; flex-direction: column"><span style="font-weight: 600">데이터베이스 수업</span><span style="font-size: 13px; color: #626770">10:30 – 12:20</span></span>
      </div>
      <div style="display: flex; gap: 12px; padding: 12px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E6EB">
        <span style="width: 4px; border-radius: 2px; background: #1F7FB8"></span>
        <span style="display: flex; flex-direction: column"><span style="font-weight: 600">AI 기말시험</span><span style="font-size: 13px; color: #626770">15:00 – 17:00 · 강의동 2층</span></span>
      </div>
      <div style="display: flex; gap: 12px; padding: 12px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E6EB">
        <span style="width: 4px; border-radius: 2px; background: #1F7FB8"></span>
        <span style="display: flex; flex-direction: column"><span style="font-weight: 600">친구들이랑 저녁</span><span style="font-size: 13px; color: #626770">19:00 – 21:00</span></span>
      </div>
    </section>
  </div>

  <button type="button" aria-label="일정 추가" style="position: absolute; right: 20px; bottom: 104px; width: 56px; height: 56px; border: 0; border-radius: 50%; background: #1F7FB8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(23, 24, 28, 0.18)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
  </button>

  <nav aria-label="탭" style="flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 8px 24px; background: #FFFFFF; border-top: 1px solid #E4E6EB">
    <a href="PhoneToday.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; color: #626770; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>오늘</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; color: #17181C; text-decoration: none; font-size: 11px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>캘린더</a>
    <a href="PhoneShiro.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; color: #626770; text-decoration: none; font-size: 11px; font-weight: 500">
      <img src="/_blob/e484ac5ceb46043b71c01ae0b9d3decc" alt="" style="width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 2px solid #1F7FB8">시로</a>
    <a href="PhoneBudget.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; color: #626770; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg>가계부</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; color: #626770; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg>더보기</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // November 2026 starts on a Sunday; 1 = a Google Calendar event, 2 = a Canvas deadline.
    const marks = { 3: [1], 5: [1, 1], 9: [1], 10: [1], 12: [1], 13: [2], 17: [1], 18: [1], 19: [1], 21: [1], 24: [1, 1], 26: [1], 27: [1, 1, 1], 31: [2], 33: [1], 34: [2] };
    const days = [];
    for (let i = 0; i < 35; i++) {
      const inMonth = i < 30;
      days.push({
        num: inMonth ? i + 1 : i - 29,
        today: i + 1 === 27,
        plain: inMonth && i + 1 !== 27,
        muted: !inMonth,
        dots: (marks[i + 1] || []).slice(0, 3).map((k) => ({ canvas: k === 2, normal: k !== 2 })),
      });
    }
    return { days };
  }
}
</script>
</body>
</html>
